services:
  backend:
    build:
      context: ./backend
      target: runtime
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/app.db   # fixed: the DB always lives on the named volume
      PORT: "8000"
    ports:
      - "8000:8000"
    volumes:
      - chat_data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  chat_data:
